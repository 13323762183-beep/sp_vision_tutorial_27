# TODO: 在此补全参数
planner_server:
  ros__parameters:
    costmap_topic: "/global_costmap"
    local_costmap_topic: "/local_costmap/costmap"
    path_topic: "/global_path"
    plugin_name: "AStar"
    plugin_type: "sp_global_planner/AStarPlanner"

    AStar:
      lethal_cost: 100        # cost >= 100 的栅格不可通行
      cost_weight: 2.0        # 软代价权重：越大越愿意绕远走通道中线


esdf_map_publisher:
  ros__parameters:
    map_yaml: "sp_nav_bringup/map/maze_map.yaml"
    frame_id: "map"
    publish_rate_hz: 2.0
    unknown_as_obstacle: false
    robot_radius: 0.25
    margin: 0.10
    d_safe: 0.70
    w: 12.0
    unknown_cost: 0
    visualize_esdf: false

controller_server:
  ros__parameters:
    local_path_topic: "/global_path"
    odom_topic: "/Odometry"
    odom_frame_id: "lidar_odom"
    map_frame_id: "map"
    cmd_vel_topic: "/sentry/cmd_vel"
    base_frame_id: "base_link"
    control_frequency: 50.0

    plugin_name: "PidController"
    plugin_type: "PidController"

    PidController:
      base_frame_id: "base_link"
      # --- 实测标定（本机 WSL Ubuntu22.04 + 仿真器）---
      max_linear_vel: 1.35    # 底盘带小陀螺自旋时实测可达约 1.38 m/s，别贪
      lat_acc: 1.8            # 过弯向心加速度上限（过弯速度=sqrt(a_lat/R)），调大实测会切弯撞墙，调小反而易蹭墙
      dec_acc: 1.2            # 速度剖面刹车减速度
      lookahead_min: 0.30     # 前视距离下限 m
      lookahead_max: 0.50     # 前视距离上限 m
      lookahead_gain: 0.15    # 前视距离 = min + gain * v
      # --- 参考路径稳定性 ---
      ref_dev_tol: 0.60       # 新规划偏离参考路径超过该值才换参考（抑制 10Hz 重规划抖动）
      # --- 全向解耦跟踪（默认启用，决定路径跟踪精度）---
      # 横向误差不再折算成航向角，而是直接给一个「法向平移速度」。
      # 全向底盘能横着走，横向偏差就该横向修，这样才不会 S 型画龙。
      decouple_tracking: true # true=解耦（推荐）；false=退回纯跟踪方向角修正
      dec_kp: 2.0             # 法向速度 = -(kp*e_lat + kd*v_n)，横向误差 P
      dec_kd: 0.35            # 横向速度阻尼 D（补偿底盘速度滞后）
      dec_vmax: 0.60          # 法向纠偏速度上限 m/s
      # --- 以下三项只在 decouple_tracking:=false 时生效（保留做对比）---
      lat_gain: 0.0           # 横向误差 P（折成航向角，实测加大会振荡）
      lat_damp: 0.0           # 横向速度 D（折成航向角，实测有害）
      dir_adapt_gain: 0.10    # 方向偏差自适应增益（抵消底盘系统性方向偏差）
      # --- 通用 ---
      predict_dt: 0.15        # 位置预测时间 s（补偿底盘速度响应滞后，抑制摆动）
      turn_rate_max: 0.0      # 指令方向最大转速 rad/s（0=不限）
      goal_tolerance: 0.05    # 距路径终点小于该值输出零速，稳稳停住
      min_speed: 0.05         # 速度剖面下限，避免原地不动
      smooth_passes: 2        # 平滑迭代次数（圆角化直角弯）
      fine_traj: false        # 精细轨迹模式：Chaikin+重采样+三点曲率；窄通道直角弯下默认关
      publish_marker: true    # 发布 /controller_marker（车体 + 速度箭头）



sp_decision:
  ros__parameters:
    tick_rate_hz: 10.0
    tree_files:
      - "sp_decision/decision_trees/click_nav.xml"
    bt_plugins:
      - "nav_to_pose_bt_node"
      - "condition_judge_bt_node"
      - "wait_duration_bt_node"
      - "gimbal_control_bt_node"
      - "chassis_mode_bt_node"
      - "set_double_bt_node"



nav_interface_node:
  ros__parameters:
    default_bt_xml: "sp_nav_bt/nav_bt/default_nav_with_fallback.xml"
    enable_bt_cout_logger: false
    bt_plugins:
      - "nav_compute_path_service"
      - "nav_state_track"
      - "nav_rate_control"
      - "nav_repeat_sequence"
      - "nav_get_pose"
      - "nav_set_control_enable"
